<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — Delusions</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<div class="topbar" id="topnav-top"><span>Spineshatter EU · Horde</span><span></span></div>
<div class="nav" id="topnav"></div>

<div class="page">
  <div class="label" style="margin-bottom:0.4rem;">Officer Tools</div>
  <h1 style="margin-bottom:2rem;">Applications</h1>
  <div id="app-list" style="display:flex;flex-direction:column;gap:1rem;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=19"></script>
<script>
let apps = [];
let webhookUrl = null;
let pingRoleId = null;

async function loadWebhook() {
  try {
    const res = await sb.from('site_content').select('*').eq('key','config.discord_webhook_url').single();
    webhookUrl = res.data?.text || null;
  } catch (e) { webhookUrl = null; }
  try {
    const res2 = await sb.from('site_content').select('*').eq('key','config.discord_role_id').single();
    pingRoleId = res2.data?.text || null;
  } catch (e) { pingRoleId = null; }
}

function pingDiscord(text, mentionRole) {
  if (!webhookUrl) return;
  const mention = (mentionRole && pingRoleId) ? `<@&${pingRoleId}> ` : '';
  fetch(webhookUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      content: mention + text,
      allowed_mentions: (mentionRole && pingRoleId) ? { roles: [pingRoleId] } : { parse: [] }
    })
  }).catch(() => {}); // best-effort, never block the actual action on this
}

async function load() {
  const { data, error } = await sb.from('applications').select('*').order('submitted_at', {ascending:false});
  if (error) { toast(error.message, 'error'); return; }
  apps = data || [];
  render();
}

function render() {
  const el = document.getElementById('app-list');
  if (!apps.length) { el.innerHTML = `<div class="card" style="text-align:center;color:var(--dim);">No applications yet.</div>`; return; }
  el.innerHTML = apps.map(a => `
    <div class="card ${a.status==='pending'?'card-warn':''}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:0.6rem;">
        <div>
          <div style="color:var(--white);font-weight:600;font-size:1.1rem;">${esc(a.applicant_name)}</div>
          <div class="label">${esc(a.class_spec)} · ${fmtDate(a.submitted_at)}</div>
        </div>
        <span class="pill ${a.status}">${esc(a.status)}</span>
      </div>
      ${a.warcraftlogs_url ? `<div style="margin-bottom:0.6rem;"><a href="${esc(a.warcraftlogs_url)}" target="_blank" rel="noopener" class="label" style="color:var(--red-bright);">Warcraft Logs →</a></div>` : ''}
      <p style="margin-bottom:0.6rem;"><span class="label" style="display:block;margin-bottom:0.2rem;">Experience</span>${esc(a.experience) || '<span style="color:var(--dim)">Nothing provided.</span>'}</p>
      ${a.why_join ? `<p style="margin-bottom:1rem;"><span class="label" style="display:block;margin-bottom:0.2rem;">Why Delusions</span>${esc(a.why_join)}</p>` : ''}
      ${a.status === 'pending' ? `
        <div style="margin-bottom:0.8rem;">
          <label class="form-label">Note to applicant (optional — they'll see this)</label>
          <textarea id="note-${a.id}" rows="2" placeholder="e.g. Approved, please join our Discord and introduce yourself!" style="width:100%;font-size:0.85rem;"></textarea>
        </div>
      ` : (a.officer_note ? `<p style="margin-bottom:1rem;"><span class="label" style="display:block;margin-bottom:0.2rem;">Note left for applicant</span>${esc(a.officer_note)}</p>` : '')}
      <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
        ${a.status==='pending' ? `
          <button class="btn primary" onclick="decide('${a.id}','accepted')">Accept</button>
          <button class="btn danger" onclick="decide('${a.id}','rejected')">Reject</button>
        ` : ''}
        <button class="btn" onclick="removeApp('${a.id}')" title="Deletes this application — the applicant can then apply again">Remove</button>
      </div>
    </div>
  `).join('');
}

async function decide(id, status) {
  const app = apps.find(a => a.id === id);
  const noteInput = document.getElementById(`note-${id}`);
  const note = noteInput ? noteInput.value.trim() : '';

  const { error } = await sb.from('applications').update({ status, officer_note: note || null }).eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  if (status === 'accepted' && app?.user_id) {
    const { data: profile } = await sb.from('profiles').select('joined_at').eq('id', app.user_id).single();
    const patch = { role: 'member' };
    if (profile && !profile.joined_at) patch.joined_at = new Date().toISOString();
    await sb.from('profiles').update(patch).eq('id', app.user_id);
  }
  const officer = currentProfile?.username || 'An officer';
  const verb = status === 'accepted' ? 'approved' : 'declined';
  if (app) pingDiscord(`${officer} ${verb} application of **${app.applicant_name}** - ${app.class_spec}`, true);
  if (app) logActivity(`${verb === 'approved' ? 'Approved' : 'Declined'} application of ${app.applicant_name} - ${app.class_spec}`);
  toast(`Application ${status}.`, 'success');
  await load();
}

async function removeApp(id) {
  const app = apps.find(a => a.id === id);
  if (!confirm('Remove this application? The applicant will be able to submit a new one.')) return;
  const { error } = await sb.from('applications').delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  const officer = currentProfile?.username || 'An officer';
  if (app) pingDiscord(`${officer} removed application of **${app.applicant_name}** - ${app.class_spec}`, true);
  if (app) logActivity(`Removed application of ${app.applicant_name} - ${app.class_spec}`);
  toast('Application removed.', 'success');
  await load();
}

(async () => {
  const ok = await requireOfficer();
  if (!ok) return;
  renderNav('applications');
  await loadWebhook();
  await load();
})();
</script>
</body>
</html>
