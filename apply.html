<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Delusions</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<div class="topbar" id="topnav-top">
  <span>Spineshatter EU · Horde</span>
  <div style="display:flex;align-items:center;gap:1rem;">
    <span id="edit-toggle-wrap"></span>
    <span></span>
  </div>
</div>
<div class="nav" id="topnav"></div>

<div class="page-narrow" style="padding-top:4rem;">
  <a href="index.html" class="back">← Home</a>
  <div class="label" style="margin-bottom:0.5rem;" data-edit="apply.eyebrow">Recruitment</div>
  <h1 data-edit="apply.title">Apply to Trial</h1>
  <p style="margin-bottom:2.5rem;" data-edit="apply.intro">Tell us about your character. An officer will follow up on Discord.</p>

  <div id="already-applied" style="display:none;"></div>

  <form id="apply-form" class="card" style="padding:1.8rem;">
    <div class="form-group">
      <label class="form-label" data-edit="apply.field.name">Character Name</label>
      <input type="text" id="f-name" required placeholder="e.g. Deetarded" data-edit-placeholder="apply.field.name.ph">
    </div>
    <div class="form-group">
      <label class="form-label" data-edit="apply.field.class">Class / Spec</label>
      <input type="text" id="f-class" required placeholder="e.g. Resto Shaman" data-edit-placeholder="apply.field.class.ph">
    </div>
    <div class="form-group">
      <label class="form-label" data-edit="apply.field.logs">Warcraft Logs</label>
      <input type="text" id="f-logs" placeholder="Link to your logs (Warcraft Logs profile or a recent parse)" data-edit-placeholder="apply.field.logs.ph">
    </div>
    <div class="form-group">
      <label class="form-label" data-edit="apply.field.exp">Experience</label>
      <textarea id="f-exp" rows="5" placeholder="Raiding history, availability, anything we should know." data-edit-placeholder="apply.field.exp.ph"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label" data-edit="apply.field.why">Why Delusions?</label>
      <textarea id="f-why" rows="4" placeholder="What are you looking for in a guild?" data-edit-placeholder="apply.field.why.ph"></textarea>
    </div>
    <button type="submit" class="btn primary" style="width:100%;justify-content:center;padding:0.85rem;"><span data-edit="apply.submit.label">Submit Application</span></button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=19"></script>
<script src="editor.js?v=19"></script>
<script>
(async () => {
  await loadSession();
  renderNav('apply');
  await initEditableHome(); // safe no-op for the sections this page doesn't have; wires up label editing + Edit Mode toggle for officers

  if (isLoggedIn()) {
    let mine = null;
    try {
      const res = await sb.from('applications').select('*').eq('user_id', currentUser.id).order('submitted_at',{ascending:false}).limit(1).single();
      mine = res.data;
    } catch (e) { mine = null; }
    if (mine && mine.status !== 'rejected') {
      document.getElementById('already-applied').style.display='block';
      document.getElementById('already-applied').innerHTML = `
        <div class="card card-accent" style="margin-bottom:1.5rem;">
          You already applied as <b style="color:var(--white)">${esc(mine.applicant_name)}</b> —
          status: <span class="pill ${mine.status}">${esc(mine.status)}</span>
          ${mine.officer_note ? `<div style="margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--hair);"><span class="label" style="display:block;margin-bottom:0.2rem;">Note from an officer</span>${esc(mine.officer_note)}</div>` : ''}
        </div>`;
      document.getElementById('apply-form').style.display='none';
    } else if (mine && mine.status === 'rejected') {
      document.getElementById('already-applied').style.display='block';
      document.getElementById('already-applied').innerHTML = `
        <div class="card" style="margin-bottom:1.5rem;">
          Your previous application wasn't accepted, but you're welcome to apply again below.
          ${mine.officer_note ? `<div style="margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--hair);"><span class="label" style="display:block;margin-bottom:0.2rem;">Note from an officer</span>${esc(mine.officer_note)}</div>` : ''}
        </div>`;
    }
  }

  document.getElementById('apply-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!isLoggedIn()) { toast('Please login with Discord first.', 'error'); setTimeout(()=>window.location.href='login.html', 1000); return; }
    const payload = {
      user_id: currentUser.id,
      applicant_name: document.getElementById('f-name').value,
      class_spec: document.getElementById('f-class').value,
      warcraftlogs_url: document.getElementById('f-logs').value,
      experience: document.getElementById('f-exp').value,
      why_join: document.getElementById('f-why').value,
      status: 'pending'
    };
    const { error } = await sb.from('applications').insert(payload);
    if (error) { toast(error.message, 'error'); return; }

    // Ping Discord if an officer has set a webhook URL (and optionally an @role to mention)
    let cfg = null, cfgRole = null;
    try {
      const res = await sb.from('site_content').select('*').eq('key','config.discord_webhook_url').single();
      cfg = res.data;
    } catch (e) { cfg = null; }
    try {
      const res2 = await sb.from('site_content').select('*').eq('key','config.discord_role_id').single();
      cfgRole = res2.data;
    } catch (e) { cfgRole = null; }
    if (cfg?.text) {
      const mention = cfgRole?.text ? `<@&${cfgRole.text}> ` : '';
      fetch(cfg.text, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `${mention}📜 New trial application: **${payload.applicant_name}** - ${payload.class_spec}`,
          allowed_mentions: cfgRole?.text ? { roles: [cfgRole.text] } : { parse: [] }
        })
      }).catch(() => {}); // best-effort, don't block submission on this
    }

    toast('Application submitted!', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  });
})();
</script>
</body>
</html>
