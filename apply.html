<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Delusions</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar" id="topnav-top"><span>Spineshatter EU · Horde</span><span></span></div>
<div class="nav" id="topnav"></div>

<div class="page-narrow" style="padding-top:4rem;">
  <a href="index.html" class="back">← Home</a>
  <div class="label" style="margin-bottom:0.5rem;">Recruitment</div>
  <h1>Apply to Trial</h1>
  <p style="margin-bottom:2.5rem;">Tell us about your character. An officer will follow up on Discord.</p>

  <div id="already-applied" style="display:none;"></div>

  <form id="apply-form" class="card" style="padding:1.8rem;">
    <div class="form-group">
      <label class="form-label">Character Name</label>
      <input type="text" id="f-name" required placeholder="e.g. Deetarded">
    </div>
    <div class="form-group">
      <label class="form-label">Class / Spec</label>
      <input type="text" id="f-class" required placeholder="e.g. Resto Shaman">
    </div>
    <div class="form-group">
      <label class="form-label">Experience</label>
      <textarea id="f-exp" rows="5" placeholder="Raiding history, availability, anything we should know."></textarea>
    </div>
    <button type="submit" class="btn primary" style="width:100%;justify-content:center;padding:0.85rem;">Submit Application</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
(async () => {
  await loadSession();
  renderNav('apply');

  if (isLoggedIn()) {
    const { data: mine } = await sb.from('applications').select('*').eq('user_id', currentUser.id).order('submitted_at',{ascending:false}).limit(1).single();
    if (mine) {
      document.getElementById('already-applied').style.display='block';
      document.getElementById('already-applied').innerHTML = `
        <div class="card card-accent" style="margin-bottom:1.5rem;">
          You already applied as <b style="color:var(--white)">${esc(mine.applicant_name)}</b> —
          status: <span class="pill ${mine.status}">${esc(mine.status)}</span>
        </div>`;
      document.getElementById('apply-form').style.display='none';
    }
  }

  document.getElementById('apply-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!isLoggedIn()) { toast('Please login with Discord first.', 'error'); setTimeout(()=>window.location.href='login.html', 1000); return; }
    const payload = {
      user_id: currentUser.id,
      applicant_name: document.getElementById('f-name').value,
      class_spec: document.getElementById('f-class').value,
      experience: document.getElementById('f-exp').value,
      status: 'pending'
    };
    const { error } = await sb.from('applications').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast('Application submitted!', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  });
})();
</script>
</body>
</html>
