<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Delusions</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  .page-wide{max-width:920px;margin:0 auto;padding:0 2rem 5rem;}
  .ledger-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.8rem;margin-bottom:1.5rem;}
  .ledger-search{background:var(--deep);border:1px solid var(--hair);color:var(--bone);padding:0.55rem 0.9rem;font-family:'Manrope',sans-serif;font-size:0.85rem;min-width:220px;}

  table.ledger-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;color:var(--dim);text-transform:uppercase;padding:0.6rem 0.8rem;border-bottom:1px solid var(--hair);}
  table.ledger-table td{padding:0.6rem 0.8rem;border-bottom:1px solid var(--hair2);font-size:0.88rem;color:var(--mist);}
  table.ledger-table tr:hover td{background:var(--deep);}
  .player-link{color:var(--bone);cursor:pointer;font-weight:500;}
  .player-link:hover{color:var(--red-bright);text-decoration:underline;}
  .item-name{color:var(--white);}
  .class-tag{padding:0.1rem 0.5rem;border-radius:3px;font-size:0.78rem;font-weight:600;display:inline-block;white-space:nowrap;}

  .upload-zone{border:1px dashed var(--hair);padding:1.5rem;text-align:center;margin-bottom:1.2rem;}
  .upload-zone.drag{border-color:var(--red-bright);}
  .map-table{width:100%;margin-bottom:1.2rem;}
  .map-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--dim);text-transform:uppercase;padding:0.4rem;}
  .map-table td{padding:0.4rem;font-size:0.82rem;color:var(--mist);}
  .map-table select{background:var(--deep);border:1px solid var(--hair);color:var(--bone);padding:0.3rem 0.5rem;font-size:0.8rem;}
  .preview-note{font-size:0.8rem;color:var(--dim);margin-bottom:1rem;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(6,5,5,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
  .modal-card{background:var(--deep);border:1px solid var(--hair);max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:1.8rem;position:relative;}
  .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--dim);font-size:1.4rem;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--white);}
  .modal-section{margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--hair);}
  .modal-section h4{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;margin-bottom:0.7rem;}
  .modal-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.35rem 0;border-bottom:1px solid var(--hair2);color:var(--mist);}
  .modal-row:last-child{border-bottom:none;}
  .modal-pct{font-family:'Newsreader',serif;font-size:2.2rem;color:var(--white);}

  .raid-group{border:1px solid var(--hair);margin-bottom:0.7rem;}
  .raid-group-header{display:flex;align-items:center;gap:0.8rem;padding:0.9rem 1.1rem;cursor:pointer;background:var(--surface);}
  .raid-group-header:hover{background:var(--deep);}
  .raid-group-header .label{margin-left:auto;display:flex;align-items:center;gap:0.7rem;}
  .expand-icon{
    font-family:'IBM Plex Mono',monospace;color:var(--red-bright);font-size:0.85rem;
    width:1.3rem;height:1.3rem;flex-shrink:0;border:1px solid var(--hair);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
  }
  .raid-group-title{color:var(--white);font-weight:500;font-size:0.92rem;}
  .raid-group table{margin:0;}
  .raid-group td, .raid-group th{padding:0.55rem 1.1rem;}

  .row-delete{
    background:none;border:1px solid var(--hair);border-radius:3px;cursor:pointer;
    color:var(--mist);width:1.6rem;height:1.6rem;display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:all .15s;padding:0;
  }
  .row-delete:hover{color:var(--red-glow);border-color:var(--red-bright);background:rgba(197,55,55,0.12);}
  .row-delete svg{width:14px;height:14px;display:block;}

  .roster-chip{
    display:inline-flex;align-items:center;gap:0.55rem;background:var(--surface);
    border:1px solid var(--hair);padding:0.35rem 0.75rem;border-radius:4px;
  }
  .roster-chip .player-link{font-size:0.85rem;}
</style>
</head>
<body>

<div class="topbar" id="topnav-top"><span>Spineshatter EU · Horde</span><span></span></div>
<div class="nav" id="topnav"></div>

<div class="page-wide" style="padding-top:3rem;">
  <div class="label" style="margin-bottom:0.5rem;">Records</div>
  <h1 style="font-family:'Newsreader',serif;color:var(--white);font-size:2rem;margin-bottom:0.5rem;" id="page-h1">Loot</h1>
  <p style="color:var(--mist);margin-bottom:1.5rem;" id="page-sub">Every item awarded, from council to roster — click a name for their full history.</p>

  <div id="tab-row" style="display:flex;gap:0.6rem;margin-bottom:2rem;border-bottom:1px solid var(--hair);padding-bottom:1rem;">
    <button class="btn" id="tab-loot" onclick="showTab('loot')">Loot</button>
    <button class="btn" id="tab-attendance" style="display:none;" onclick="showTab('attendance')">Attendance</button>
  </div>

  <div id="panel-loot">
    <div id="officer-upload" style="display:none;"></div>
    <div class="ledger-toolbar">
      <input type="text" class="ledger-search" id="loot-search" placeholder="Search item or player...">
      <span style="display:flex;align-items:center;gap:1rem;">
        <span class="label" id="loot-count"></span>
        <button class="btn" type="button" onclick="downloadLootCSV()">Download CSV</button>
      </span>
    </div>
    <div id="loot-body"></div>
  </div>

  <div id="panel-attendance" style="display:none;">
    <div id="officer-attendance-form" style="display:none;"></div>
    <div id="last-raid-card"></div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:2rem;">
      <table class="ledger-table">
        <thead><tr><th>Player</th><th>Class</th><th>Nights</th><th>Attendance %</th></tr></thead>
        <tbody id="attendance-body"></tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="font-family:'Newsreader',serif;font-style:italic;color:var(--white);">All Raid Nights (<span id="nights-count">0</span>)</h3>
      <button class="btn" type="button" onclick="downloadAttendanceCSV()">Download CSV</button>
    </div>
    <div id="nights-list"></div>
  </div></div>

<div class="modal-backdrop" id="player-modal" style="display:none;" onclick="if(event.target===this) closePlayerModal()">
  <div class="modal-card">
    <button class="modal-close" onclick="closePlayerModal()">×</button>
    <div id="player-modal-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=18"></script>
<script>
const CLASS_COLORS = {
  warrior:'#C79C6E', paladin:'#F58CBA', hunter:'#ABD473', rogue:'#FFF569',
  priest:'#FFFFFF', shaman:'#0070DE', mage:'#69CCF0', warlock:'#9482C9', druid:'#FF7D0A'
};
function classTag(name) {
  if (!name) return '<span style="color:var(--dim)">—</span>';
  const color = CLASS_COLORS[name.toLowerCase()] || '#948a8a';
  const display = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
  return `<span class="class-tag" style="color:${color};background:${color}22;">${esc(display)}</span>`;
}

const TRASH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';

function downloadCSV(filename, headers, rows) {
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadLootCSV() {
  downloadCSV('delusions-loot-log.csv',
    ['Date', 'Boss', 'Item', 'Response', 'Winner'],
    allLoot.map(r => [r.awarded_at || '', r.raid_title || '', r.item_name || '', r.response || '', r.winner_name || '']));
}

function downloadAttendanceCSV() {
  const rows = allAttendees.map(a => {
    const night = allNights.find(n => n.id === a.raid_night_id);
    return [night?.raid_date || '', night?.title || '', a.character_name || '', a.class_name || ''];
  });
  downloadCSV('delusions-attendance.csv', ['Date', 'Raid', 'Character', 'Class'], rows);
}

let allLoot = [];
let allNights = [];
let allAttendees = [];

function showTab(name) {
  document.getElementById('panel-loot').style.display = name === 'loot' ? '' : 'none';
  document.getElementById('panel-attendance').style.display = name === 'attendance' ? '' : 'none';
  document.getElementById('tab-loot').classList.toggle('primary', name === 'loot');
  document.getElementById('tab-attendance').classList.toggle('primary', name === 'attendance');
  document.getElementById('page-h1').textContent = name === 'attendance' ? 'Attendance' : 'Loot';
  if (name === 'attendance') {
    document.getElementById('page-sub').textContent = 'Who showed up, raid by raid — exported from the in-game addon.';
  } else if (isOfficer()) {
    document.getElementById('page-sub').textContent = 'Every item awarded, from council to roster — click a name for their full history.';
  } else {
    document.getElementById('page-sub').textContent = "Every item awarded to the guild — click a name to see what they've received.";
  }
}

async function loadLoot() {
  const { data, error } = await sb.from('loot_log').select('*').order('awarded_at', { ascending: false }).order('created_at', { ascending: false });
  if (error) { toast(error.message, 'error'); return; }
  allLoot = data || [];
  renderLoot();
}

let expandedLootDates = null; // null = not yet initialized; Set once we know the data

function renderLoot() {
  const search = document.getElementById('loot-search').value.trim().toLowerCase();
  let rows = allLoot;
  if (search) rows = rows.filter(r => (r.item_name||'').toLowerCase().includes(search) || (r.winner_name||'').toLowerCase().includes(search));
  document.getElementById('loot-count').textContent = `${rows.length} award${rows.length!==1?'s':''}`;

  const groups = {};
  const order = [];
  rows.forEach(r => {
    const key = r.awarded_at || 'unknown';
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(r);
  });

  if (expandedLootDates === null) {
    expandedLootDates = new Set(order.slice(0, 1)); // most recent date starts expanded, rest collapsed
  }

  document.getElementById('loot-body').innerHTML = order.map(dateKey => {
    const items = groups[dateKey];
    const expanded = expandedLootDates.has(dateKey);
    const dateLabel = dateKey === 'unknown' ? 'No date' : new Date(dateKey).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
    const bosses = [...new Set(items.map(i => i.raid_title).filter(Boolean))];

    return `
      <div class="raid-group">
        <div class="raid-group-header" onclick="toggleLootGroup('${dateKey}')">
          <span class="expand-icon">${expanded ? '−' : '+'}</span>
          <span class="raid-group-title">${esc(dateLabel)}</span>
          <span class="label">
            ${items.length} item${items.length!==1?'s':''}${bosses.length ? ' · ' + esc(bosses.join(', ')) : ''}
            ${isOfficer() ? `<button class="row-delete" title="Remove this entire log" onclick="event.stopPropagation(); deleteLootGroup('${dateKey}')">${TRASH_ICON}</button>` : ''}
          </span>
        </div>
        ${expanded ? `
        <table class="ledger-table">
          <thead><tr><th>Boss</th><th>Item</th><th>Response</th><th>Winner</th>${isOfficer()?'<th></th>':''}</tr></thead>
          <tbody>
            ${items.map(r => `
              <tr>
                <td>${esc(r.raid_title || '—')}</td>
                <td class="item-name">${r.item_link ? `<a href="${esc(r.item_link)}" target="_blank" rel="noopener" style="color:inherit;">${esc(r.item_name)}</a>` : esc(r.item_name || '—')}</td>
                <td>${esc(r.response || '—')}</td>
                <td><span class="player-link" onclick="openPlayerModal('${esc(r.winner_name||'').replace(/'/g,"\\'")}')">${esc(r.winner_name || '—')}</span></td>
                ${isOfficer() ? `<td><button class="row-delete" title="Remove this item" onclick="deleteLootItem('${r.id}')">${TRASH_ICON}</button></td>` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>` : ''}
      </div>`;
  }).join('') || `<div class="card" style="text-align:center;color:var(--dim);">No loot logged yet.</div>`;
}

function toggleLootGroup(dateKey) {
  if (expandedLootDates.has(dateKey)) expandedLootDates.delete(dateKey); else expandedLootDates.add(dateKey);
  renderLoot();
}

async function deleteLootItem(id) {
  const item = allLoot.find(r => r.id === id);
  if (!confirm('Remove this item from the loot log?')) return;
  const { error } = await sb.from('loot_log').delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  if (item) logActivity(`Removed loot item "${item.item_name}" (${item.winner_name})`);
  toast('Removed.', 'success');
  await loadLoot();
  if (document.getElementById('player-modal').style.display === 'flex') refreshOpenModal();
}

async function deleteLootGroup(dateKey) {
  const items = allLoot.filter(r => (r.awarded_at || 'unknown') === dateKey);
  if (!confirm(`Remove this entire log — all ${items.length} item${items.length!==1?'s':''} for this date? This can't be undone.`)) return;
  const { error } = await sb.from('loot_log').delete().in('id', items.map(r => r.id));
  if (error) { toast(error.message, 'error'); return; }
  logActivity(`Removed entire loot log for ${dateKey} (${items.length} items)`);
  toast(`Removed ${items.length} items.`, 'success');
  await loadLoot();
  if (document.getElementById('player-modal').style.display === 'flex') refreshOpenModal();
}
document.getElementById('loot-search').addEventListener('input', renderLoot);

let parsedCsv = null;

function renderUploadUI() {
  document.getElementById('officer-upload').style.display = 'block';
  document.getElementById('officer-upload').innerHTML = `
    <h3 style="margin-bottom:1rem;cursor:pointer;font-size:0.95rem;color:var(--white);" onclick="toggleCollapse('upload-body','upload-toggle')">
      <span id="upload-toggle" class="collapse-icon">+</span> Add Loot
    </h3>
    <div id="upload-body" style="display:none;margin-bottom:1.5rem;">
      <div class="upload-zone" id="drop-zone">
        <p style="margin-bottom:0.8rem;color:var(--mist);">Drop your RCLootCouncil CSV export here, or</p>
        <input type="file" id="csv-input" accept=".csv" style="display:none;">
        <button class="btn primary" type="button" onclick="document.getElementById('csv-input').click()">Choose CSV File</button>
      </div>
      <div class="card" style="margin-bottom:1.2rem;">
        <div class="label" style="margin-bottom:0.6rem;">Or paste it directly</div>
        <textarea id="csv-paste" rows="6" placeholder="Paste the raw CSV text here (header row + data rows)" style="width:100%;margin-bottom:0.8rem;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;"></textarea>
        <button class="btn primary" type="button" onclick="handlePastedCsv()">Parse Pasted CSV</button>
      </div>
      <div id="mapping-ui"></div>
    </div>
  `;
  const dropZone = document.getElementById('drop-zone');
  document.getElementById('csv-input').addEventListener('change', e => e.target.files[0] && handleFile(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

function handlePastedCsv() {
  const text = document.getElementById('csv-paste').value.trim();
  if (!text) { toast('Paste some CSV text first.', 'error'); return; }
  const results = Papa.parse(text, { header: true, skipEmptyLines: true });
  if (!results.data.length) { toast('Could not find any rows in that paste.', 'error'); return; }
  parsedCsv = results;
  showMappingUI(results);
}

function handleFile(file) {
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (results) => {
      if (!results.data.length) { toast('That CSV looks empty.', 'error'); return; }
      parsedCsv = results;
      showMappingUI(results);
    },
    error: (err) => toast('Could not read that file: ' + err.message, 'error'),
  });
}

const TARGET_FIELDS = [
  { key: 'item_name', label: 'Item name', required: true },
  { key: 'winner_name', label: 'Winner / player', required: true },
  { key: 'class_name', label: 'Player class', required: false },
  { key: 'awarded_at', label: 'Date', required: false },
  { key: 'raid_title', label: 'Boss / raid', required: false },
  { key: 'response', label: 'Response (BIS/MS/OS)', required: false },
  { key: 'item_id', label: 'Item ID (auto-builds a Wowhead link)', required: false },
  { key: 'item_link', label: 'Item link (only if you already have a full URL column)', required: false },
];

function guessColumn(fields, targetKey) {
  const lower = fields.map(f => f.toLowerCase());
  const patterns = {
    item_name: ['item', 'itemname', 'name'],
    winner_name: ['player', 'name', 'winner', 'recipient', 'candidate'],
    class_name: ['class', 'playerclass'],
    awarded_at: ['date', 'time', 'awarded', 'timestamp'],
    raid_title: ['boss', 'instance', 'raid', 'zone'],
    response: ['response', 'reason', 'type'],
    item_id: ['itemid', 'id'],
    item_link: ['link', 'url', 'wowhead'],
  };
  for (const p of patterns[targetKey] || []) { const idx = lower.findIndex(f => f === p); if (idx >= 0) return fields[idx]; }
  for (const p of patterns[targetKey] || []) { const idx = lower.findIndex(f => f.includes(p)); if (idx >= 0) return fields[idx]; }
  return '';
}

function showMappingUI(results) {
  const fields = results.meta.fields || [];
  const mappingRows = TARGET_FIELDS.map(t => {
    const guess = guessColumn(fields, t.key);
    return `<tr><td>${t.label}${t.required?' *':''}</td><td>
      <select data-target="${t.key}">
        <option value="">— not in this CSV —</option>
        ${fields.map(f => `<option value="${esc(f)}" ${f===guess?'selected':''}>${esc(f)}</option>`).join('')}
      </select></td></tr>`;
  }).join('');

  document.getElementById('mapping-ui').innerHTML = `
    <div class="preview-note">Found ${results.data.length} rows and ${fields.length} columns. Confirm which column is which — auto-guessed where possible.</div>
    <table class="map-table"><thead><tr><th>Ledger field</th><th>Maps to CSV column</th></tr></thead><tbody>${mappingRows}</tbody></table>
    <div style="display:flex;gap:0.6rem;">
      <button class="btn primary" type="button" onclick="confirmImport()">Import ${results.data.length} Rows</button>
      <button class="btn" type="button" onclick="parsedCsv=null;document.getElementById('mapping-ui').innerHTML='';">Cancel</button>
    </div>`;
}

async function confirmImport() {
  const mapping = {};
  document.querySelectorAll('#mapping-ui select[data-target]').forEach(sel => { if (sel.value) mapping[sel.getAttribute('data-target')] = sel.value; });
  if (!mapping.item_name || !mapping.winner_name) { toast('Item name and Winner columns are required.', 'error'); return; }

  const rows = parsedCsv.data.map(row => {
    const itemId = mapping.item_id ? row[mapping.item_id] : null;
    return {
      item_name: cleanItemName(row[mapping.item_name]),
      winner_name: stripRealm(row[mapping.winner_name]),
      class_name: mapping.class_name ? row[mapping.class_name] : null,
      awarded_at: mapping.awarded_at ? parseDate(row[mapping.awarded_at]) : null,
      raid_title: mapping.raid_title ? row[mapping.raid_title] : null,
      response: mapping.response ? row[mapping.response] : null,
      item_link: mapping.item_link ? row[mapping.item_link] : (itemId ? `https://www.wowhead.com/item=${itemId}` : null),
      raw: row,
      uploaded_by: currentUser.id,
    };
  });

  const { error } = await sb.from('loot_log').insert(rows);
  if (error) { toast('Import failed: ' + error.message, 'error'); return; }
  logActivity(`Imported ${rows.length} loot awards from CSV`);
  toast(`Imported ${rows.length} awards.`, 'success');
  parsedCsv = null;
  document.getElementById('mapping-ui').innerHTML = '';
  const pasteBox = document.getElementById('csv-paste'); if (pasteBox) pasteBox.value = '';
  await loadLoot();
}

function cleanItemName(name) {
  if (!name) return name;
  return name.replace(/^\[|\]$/g, '').trim(); // "[Item Name]" -> "Item Name"
}
function stripRealm(name) {
  if (!name) return name;
  return name.split('-')[0]; // "Deetarded-Spineshatter" -> "Deetarded", matches the addon export's naming
}

function parseDate(val) { if (!val) return null; const d = new Date(val); return isNaN(d.getTime()) ? null : d.toISOString().slice(0,10); }

function renderAttendanceForm() {
  document.getElementById('officer-attendance-form').style.display = 'block';
  document.getElementById('officer-attendance-form').innerHTML = `
    <h3 style="margin-bottom:1rem;cursor:pointer;font-size:0.95rem;color:var(--white);" onclick="toggleCollapse('rn-body','rn-toggle')">
      <span id="rn-toggle" class="collapse-icon">+</span> Log a Raid Night
    </h3>
    <div id="rn-body" style="display:none;margin-bottom:1.5rem;">
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr 160px;gap:0.8rem;margin-bottom:0.8rem;">
          <input type="text" id="rn-title" placeholder="Raid title (e.g. Serpentshrine Cavern)">
          <input type="date" id="rn-date">
        </div>
        <textarea id="rn-csv" rows="8" placeholder="Paste the export from /dumpraid here (Name,Class,Guild per line — non-guild entries are auto-excluded)" style="width:100%;margin-bottom:0.8rem;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;"></textarea>
        <button class="btn primary" type="button" onclick="submitRaidNight()">Save Raid Night</button>
      </div>
    </div>
  `;
  document.getElementById('rn-date').valueAsDate = new Date();
}

const GUILD_NAME = 'Delusions'; // must match your addon's captured guild name — see /dumpraid export

function parseRosterCsv(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  const included = [];
  const excluded = [];
  for (const line of lines) {
    if (/^name\s*,\s*class/i.test(line)) continue; // header row, either 2 or 3 column version
    const parts = line.split(',').map(s => s && s.trim());
    const [name, className, guild] = parts;
    if (!name) continue;
    // Older addon exports (2 columns, no guild) have nothing to check against —
    // include them as-is rather than guessing.
    if (guild !== undefined && guild.toLowerCase() !== GUILD_NAME.toLowerCase()) {
      excluded.push(name);
      continue;
    }
    included.push({ character_name: name, class_name: className || null });
  }
  return { included, excluded };
}

async function submitRaidNight() {
  const title = document.getElementById('rn-title').value.trim();
  const date = document.getElementById('rn-date').value;
  const csvText = document.getElementById('rn-csv').value.trim();
  if (!title || !date || !csvText) { toast('Fill in title, date, and paste the roster export.', 'error'); return; }

  const { included, excluded } = parseRosterCsv(csvText);
  if (!included.length) { toast('No valid guild members found in that paste.', 'error'); return; }

  const { data: night, error } = await sb.from('raid_nights').insert({ title, raid_date: date, created_by: currentUser.id }).select().single();
  if (error) { toast(error.message, 'error'); return; }

  const rows = included.map(r => ({ raid_night_id: night.id, character_name: r.character_name, class_name: r.class_name }));
  const { error: err2 } = await sb.from('raid_attendees').insert(rows);
  if (err2) { toast(err2.message, 'error'); return; }

  logActivity(`Logged raid night "${title}" (${included.length} attendees${excluded.length ? `, ${excluded.length} pugs excluded` : ''})`);
  const excludedNote = excluded.length ? ` (${excluded.length} non-guild excluded: ${excluded.join(', ')})` : '';
  toast(`Logged ${included.length} attendees for ${title}.${excludedNote}`, 'success');
  document.getElementById('rn-title').value = '';
  document.getElementById('rn-csv').value = '';
  await loadAttendance();
}

let charToIdentity = {}; // lowercased character name -> { profileId, joinedAt, allNames }

async function loadProfiles() {
  const { data } = await sb.from('profile_characters').select('character_name, profile_id, profiles(joined_at)');
  const byProfile = {};
  (data || []).forEach(row => {
    const pid = row.profile_id;
    if (!byProfile[pid]) byProfile[pid] = { profileId: pid, joinedAt: row.profiles?.joined_at || null, allNames: [] };
    byProfile[pid].allNames.push(row.character_name);
  });
  charToIdentity = {};
  Object.values(byProfile).forEach(identity => {
    identity.allNames.forEach(n => { charToIdentity[n.toLowerCase()] = identity; });
  });
}

// Resolves a character name to its full identity (all linked alts + join
// date) if an officer has linked it to an account, otherwise treats it as
// a standalone unlinked name.
function getIdentity(characterName) {
  return charToIdentity[characterName.toLowerCase()] || { profileId: null, joinedAt: null, allNames: [characterName] };
}

// Attendance % counts only raid nights on or after a player's join date, so
// someone who joined this week isn't penalized for raids that happened
// before they existed. Aggregates across all of an account's linked
// characters (main + alts) rather than just the one name clicked. Falls
// back to full history if we don't have a linked account (e.g. invited
// outside the site).
function computeAttendance(characterName) {
  const identity = getIdentity(characterName);
  const namesLower = new Set(identity.allNames.map(n => n.toLowerCase()));
  const joinedAt = identity.joinedAt;

  let eligibleNights = allNights;
  if (joinedAt) {
    const joinedTime = new Date(joinedAt).getTime();
    eligibleNights = allNights.filter(n => n.raid_date && new Date(n.raid_date).getTime() >= joinedTime);
  }
  const attendedIds = new Set(allAttendees.filter(a => namesLower.has((a.character_name||'').toLowerCase())).map(a => a.raid_night_id));
  const attended = eligibleNights.filter(n => attendedIds.has(n.id)).length;
  const total = eligibleNights.length;
  return { attended, total, pct: total ? Math.round((attended/total)*100) : 0, joinedAt, allNames: identity.allNames };
}

async function loadAttendance() {
  const { data: nights } = await sb.from('raid_nights').select('*').order('raid_date', { ascending: false });
  const { data: attendees } = await sb.from('raid_attendees').select('*');
  allNights = nights || [];
  allAttendees = attendees || [];
  await loadProfiles();
  renderAttendance();
}

function renderAttendance() {
  document.getElementById('nights-count').textContent = allNights.length;

  const lastCard = document.getElementById('last-raid-card');
  if (allNights.length) {
    const last = allNights[0];
    const roster = allAttendees.filter(a => a.raid_night_id === last.id);
    lastCard.innerHTML = `
      <div class="card card-accent" style="margin-bottom:2rem;">
        <div class="label" style="margin-bottom:0.5rem;">Last Raid</div>
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.8rem;">
          <div style="color:var(--white);font-weight:600;font-size:1.1rem;">${esc(last.title)}</div>
          <div style="display:flex;align-items:center;gap:0.8rem;">
            <span class="label">${last.raid_date ? new Date(last.raid_date).toLocaleDateString() : ''} · ${roster.length} raiders</span>
            ${isOfficer() ? `<button class="row-delete" title="Remove this raid" onclick="deleteRaidNight('${last.id}')">${TRASH_ICON}</button>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:0.6rem;">
          ${roster.map(a => `<span class="roster-chip"><span class="player-link" onclick="openPlayerModal('${esc(a.character_name).replace(/'/g,"\\'")}')">${esc(a.character_name)}</span>${classTag(a.class_name)}</span>`).join('')}
        </div>
      </div>`;
  } else {
    lastCard.innerHTML = '';
  }

  const seenIdentity = new Set();
  const players = [];
  allAttendees.forEach(a => {
    const identity = getIdentity(a.character_name);
    const key = identity.profileId || ('unlinked:' + a.character_name.toLowerCase());
    if (seenIdentity.has(key)) return;
    seenIdentity.add(key);
    players.push({
      name: a.character_name, // used to resolve the modal — any linked name works
      displayName: identity.allNames.length > 1 ? identity.allNames.join(' / ') : a.character_name,
      className: a.class_name,
      ...computeAttendance(a.character_name),
    });
  });
  players.sort((a,b) => b.pct - a.pct);

  document.getElementById('attendance-body').innerHTML = players.map(p => `
    <tr>
      <td><span class="player-link" onclick="openPlayerModal('${esc(p.name).replace(/'/g,"\\'")}')">${esc(p.displayName)}</span></td>
      <td>${classTag(p.className)}</td>
      <td>${p.attended} / ${p.total}</td>
      <td class="item-name">${p.pct}%</td>
    </tr>
  `).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--dim);">No raid nights logged yet.</td></tr>`;

  if (expandedNights === null) expandedNights = new Set(); // all collapsed by default — "Last Raid" card already covers the newest one

  document.getElementById('nights-list').innerHTML = allNights.map(n => {
    const roster = allAttendees.filter(a => a.raid_night_id === n.id);
    const expanded = expandedNights.has(n.id);
    return `
      <div class="raid-group">
        <div class="raid-group-header" onclick="toggleNight('${n.id}')">
          <span class="expand-icon">${expanded ? '−' : '+'}</span>
          <span class="raid-group-title">${esc(n.title)} — ${n.raid_date ? new Date(n.raid_date).toLocaleDateString() : ''}</span>
          <span class="label" style="display:flex;align-items:center;gap:0.7rem;">
            ${roster.length} raiders
            ${isOfficer() ? `<button class="row-delete" title="Remove this raid" onclick="event.stopPropagation(); deleteRaidNight('${n.id}')">${TRASH_ICON}</button>` : ''}
          </span>
        </div>
        ${expanded ? `<div style="padding:1rem 1.1rem 1.1rem;display:flex;flex-wrap:wrap;gap:0.6rem;border-top:1px solid var(--hair);">
          ${roster.map(a => `<span class="roster-chip"><span class="player-link" onclick="openPlayerModal('${esc(a.character_name).replace(/'/g,"\\'")}')">${esc(a.character_name)}</span>${classTag(a.class_name)}</span>`).join('')}
        </div>` : ''}
      </div>`;
  }).join('') || `<div class="card" style="text-align:center;color:var(--dim);">Nothing here.</div>`;
}

let expandedNights = null;
function toggleNight(id) {
  if (expandedNights.has(id)) expandedNights.delete(id); else expandedNights.add(id);
  renderAttendance();
}

async function deleteRaidNight(id) {
  const night = allNights.find(n => n.id === id);
  if (!confirm('Remove this entire raid night? This also removes everyone\'s attendance record for it.')) return;
  const { error } = await sb.from('raid_nights').delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  if (night) logActivity(`Removed raid night "${night.title}" (${night.raid_date})`);
  toast('Raid night removed.', 'success');
  await loadAttendance();
  if (document.getElementById('player-modal').style.display === 'flex') refreshOpenModal();
}

let openModalPlayer = null;

function openPlayerModal(name) {
  if (!name) return;
  openModalPlayer = name;
  const officer = isOfficer();
  const identity = getIdentity(name);
  const namesLower = new Set(identity.allNames.map(n => n.toLowerCase()));

  const lootItems = allLoot.filter(r => namesLower.has((r.winner_name||'').toLowerCase()));
  const nightIds = new Set(allAttendees.filter(a => namesLower.has((a.character_name||'').toLowerCase())).map(a => a.raid_night_id));
  const attendedNights = allNights.filter(n => nightIds.has(n.id));
  const att = computeAttendance(name);

  const className = (allAttendees.find(a => namesLower.has((a.character_name||'').toLowerCase()))?.class_name)
    || (lootItems.find(l => l.class_name)?.class_name)
    || null;

  const displayName = identity.allNames.length > 1 ? identity.allNames.join(' / ') : name;

  document.getElementById('player-modal-content').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:0.7rem;margin-bottom:0.3rem;">
      <div style="font-family:'Newsreader',serif;font-size:1.5rem;color:var(--white);">${esc(displayName)}</div>
      ${classTag(className)}
    </div>
    ${officer ? `
    <div class="label" style="margin-bottom:0.8rem;">
      ${att.joinedAt
        ? `Joined ${new Date(att.joinedAt).toLocaleDateString()}`
        : 'No linked account — attendance % uses full raid history'}
    </div>
    <div class="label">${att.total ? `${att.attended} of ${att.total} raid nights` : 'No raid nights logged yet'}</div>
    <div class="modal-pct">${att.pct}%</div>

    <div class="modal-section">
      <h4>Attendance History (${attendedNights.length})</h4>
      ${attendedNights.length ? attendedNights.map(n => `
        <div class="modal-row">
          <span>${esc(n.title)}</span>
          <span style="display:flex;align-items:center;gap:0.6rem;">
            ${n.raid_date ? new Date(n.raid_date).toLocaleDateString() : ''}
            <button class="row-delete" title="Remove this raid entirely" onclick="deleteRaidNight('${n.id}')">${TRASH_ICON}</button>
          </span>
        </div>`).join('') : '<div style="color:var(--dim);font-size:0.85rem;">Nothing logged.</div>'}
    </div>` : ''}

    <div class="modal-section" style="${officer ? '' : 'margin-top:1rem;padding-top:0;border-top:none;'}">
      <h4>Loot History (${lootItems.length})</h4>
      ${lootItems.length ? lootItems.map(l => `
        <div class="modal-row">
          <span class="item-name">${esc(l.item_name)}</span>
          <span style="display:flex;align-items:center;gap:0.6rem;">
            ${l.awarded_at ? new Date(l.awarded_at).toLocaleDateString() : ''}
            ${officer ? `<button class="row-delete" title="Remove this item" onclick="deleteLootItem('${l.id}')">${TRASH_ICON}</button>` : ''}
          </span>
        </div>`).join('') : '<div style="color:var(--dim);font-size:0.85rem;">No loot recorded.</div>'}
    </div>
  `;
  document.getElementById('player-modal').style.display = 'flex';
}

function refreshOpenModal() {
  if (openModalPlayer) openPlayerModal(openModalPlayer);
}

function closePlayerModal() { document.getElementById('player-modal').style.display = 'none'; openModalPlayer = null; }

(async () => {
  const ok = await requireMember();
  if (!ok) return;
  renderNav('ledger');
  if (isOfficer()) {
    document.getElementById('tab-attendance').style.display = '';
    renderUploadUI();
    renderAttendanceForm();
  } else {
    // Members only ever see Loot — no point showing a tab switcher with one option
    document.getElementById('tab-row').style.display = 'none';
  }
  await loadLoot();
  await loadAttendance();
  showTab('loot');
})();
</script>
